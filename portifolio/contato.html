    <section>
        <div class="sec-projetos">
            <div class="sec-projetos-1">
                <div class="contato">
                    <form method="post">
                            <label for="name">Nome</label>
                            <input type="text" id="name" name="name" placeholder="Nome do Contato" required>

                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Digite o Email" required>

                            <label for="Mensagem">Mensagem</label>
                            <textarea name="Mensagem" id="mensagem" placeholder="Digite uma Mensagem"></textarea>

                            <button type="button" id="butão">Enviar</button>
                    </form>
                </div>



                <div class="contato" >
                    <a href="https://github.com/Siaticoski"><img id="imagensLink" src="img/gitnew.png" alt="git"></a>
                   
                </div>
